<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JIAN TOOLS | Precision Carbide Cutting Tools</title>

    <meta
        name="description"
        content="JIAN TOOLS — Your solution provider for all your carbide cutting tools need. Precision-engineered cutting tools and modular drilling solutions."
    >

    <meta
        name="keywords"
        content="JIAN TOOLS, carbide cutting tools, modular drills, drilling tools, CNC cutting tools, carbide tools, Vadodara"
    >

    <meta name="theme-color" content="#050608">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050608;
            font-family: "Inter", sans-serif;
        }

        body {
            color: #ffffff;
        }

        /* ================================
           VIDEO BACKGROUND
        ================================= */

        .video-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #050608;
            overflow: hidden;
        }

        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Cinematic darkness over video */

        .video-overlay {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.72) 0%,
                    rgba(0, 0, 0, 0.35) 40%,
                    rgba(0, 0, 0, 0.15) 70%,
                    rgba(0, 0, 0, 0.45) 100%
                ),
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.50) 0%,
                    transparent 35%,
                    rgba(0, 0, 0, 0.55) 100%
                );
            pointer-events: none;
        }

        /* ================================
           NAVIGATION
        ================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 28px 55px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.45),
                transparent
            );

            animation: headerIn 1.2s ease forwards;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            text-decoration: none;
            color: #ffffff;
        }

        .brand-mark {
            width: 9px;
            height: 9px;

            background: #ffffff;
            border-radius: 50%;

            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 25px rgba(255, 255, 255, 0.35);
        }

        .brand-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.18em;
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.72);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;

            background: #ffffff;

            animation: pulse 2s infinite;
        }

        /* ================================
           MAIN CONTENT
        ================================= */

        main {
            position: relative;
            z-index: 10;

            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
        }

        .content {
            width: min(700px, 90%);

            margin-left: clamp(30px, 8vw, 130px);

            transform: translateY(20px);
            opacity: 0;

            animation: contentIn 1.4s 0.6s cubic-bezier(.16,1,.3,1) forwards;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 13px;

            margin-bottom: 25px;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.28em;
            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.72);
        }

        .eyebrow-line {
            width: 38px;
            height: 1px;
            background: rgba(255, 255, 255, 0.7);
        }

        h1 {
            font-size: clamp(58px, 9vw, 128px);

            line-height: 0.88;

            font-weight: 800;

            letter-spacing: -0.065em;

            margin-bottom: 30px;

            color: #ffffff;

            text-shadow:
                0 4px 30px rgba(0, 0, 0, 0.45);
        }

        .coming-soon {
            font-size: clamp(18px, 2vw, 28px);

            font-weight: 500;

            letter-spacing: 0.22em;

            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.92);

            margin-bottom: 25px;
        }

        .tagline {
            max-width: 500px;

            font-size: clamp(13px, 1.2vw, 16px);

            line-height: 1.7;

            color: rgba(255, 255, 255, 0.70);

            letter-spacing: 0.02em;

            margin-bottom: 38px;
        }

        /* ================================
           CONTACT BUTTON
        ================================= */

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;

            padding: 15px 23px;

            color: #ffffff;
            text-decoration: none;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.16em;
            text-transform: uppercase;

            border: 1px solid rgba(255, 255, 255, 0.35);

            background: rgba(255, 255, 255, 0.06);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                background 0.35s ease,
                border-color 0.35s ease,
                transform 0.35s ease;
        }

        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.14);

            border-color: rgba(255, 255, 255, 0.8);

            transform: translateY(-2px);
        }

        .arrow {
            font-size: 17px;

            transition: transform 0.35s ease;
        }

        .contact-btn:hover .arrow {
            transform: translateX(5px);
        }

        /* ================================
           BOTTOM INFORMATION
        ================================= */

        .bottom-info {
            position: fixed;

            left: 55px;
            right: 55px;
            bottom: 28px;

            z-index: 20;

            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            pointer-events: none;
        }

        .location {
            max-width: 400px;

            font-size: 10px;
            line-height: 1.6;

            letter-spacing: 0.12em;
            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.48);
        }

        .scroll-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;

            font-size: 9px;

            letter-spacing: 0.25em;
            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.45);
        }

        .scroll-line {
            width: 1px;
            height: 38px;

            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.8),
                transparent
            );

            animation: scrollLine 2s ease-in-out infinite;
        }

        /* ================================
           LOADING SCREEN
        ================================= */

        .loader {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050608;

            transition:
                opacity 1s ease,
                visibility 1s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-inner {
            text-align: center;
        }

        .loader-brand {
            font-size: 18px;

            font-weight: 700;

            letter-spacing: 0.25em;

            margin-bottom: 20px;
        }

        .loader-line {
            width: 130px;
            height: 1px;

            background: rgba(255, 255, 255, 0.12);

            overflow: hidden;
        }

        .loader-progress {
            width: 0%;
            height: 100%;

            background: #ffffff;

            animation: loading 2s ease forwards;
        }

        /* ================================
           VIDEO PLAY FALLBACK
        ================================= */

        .play-overlay {
            position: fixed;
            inset: 0;

            z-index: 30;

            display: none;

            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.35);

            cursor: pointer;
        }

        .play-overlay.visible {
            display: flex;
        }

        .play-button {
            width: 72px;
            height: 72px;

            border: 1px solid rgba(255, 255, 255, 0.6);

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            backdrop-filter: blur(10px);

            background: rgba(255, 255, 255, 0.08);

            font-size: 22px;

            padding-left: 4px;
        }

        /* ================================
           ANIMATIONS
        ================================= */

        @keyframes loading {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        @keyframes contentIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes headerIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes scrollLine {
            0% {
                transform: scaleY(0.5);
                transform-origin: top;
                opacity: 0.3;
            }

            50% {
                transform: scaleY(1);
                opacity: 1;
            }

            100% {
                transform: scaleY(0.5);
                transform-origin: bottom;
                opacity: 0.3;
            }
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 768px) {

            header {
                padding: 22px 22px;
            }

            .brand-name {
                font-size: 14px;
            }

            .nav-status {
                font-size: 8px;
                letter-spacing: 0.12em;
            }

            .content {
                margin-left: 25px;
                margin-right: 25px;

                margin-top: 40px;
            }

            h1 {
                font-size: clamp(55px, 17vw, 90px);
            }

            .coming-soon {
                font-size: 15px;
                letter-spacing: 0.16em;
            }

            .tagline {
                font-size: 12px;
                max-width: 330px;
            }

            .bottom-info {
                left: 22px;
                right: 22px;
                bottom: 20px;
            }

            .location {
                font-size: 8px;
                max-width: 230px;
            }

            .scroll-indicator {
                display: none;
            }

            .video-overlay {
                background:
                    linear-gradient(
                        90deg,
                        rgba(0, 0, 0, 0.72),
                        rgba(0, 0, 0, 0.30)
                    ),
                    linear-gradient(
                        180deg,
                        rgba(0, 0, 0, 0.40),
                        transparent 40%,
                        rgba(0, 0, 0, 0.65)
                    );
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         LOADING SCREEN
    ========================================== -->

    <div class="loader" id="loader">

        <div class="loader-inner">

            <div class="loader-brand">
                JIAN TOOLS
            </div>

            <div class="loader-line">
                <div class="loader-progress"></div>
            </div>

        </div>

    </div>


    <!-- =========================================
         CINEMATIC VIDEO
    ========================================== -->

    <div class="video-container">

        <video
            id="heroVideo"
            autoplay
            muted
            playsinline
            preload="auto"
        >

            <source
                src="jian-tools-coming-soon.mp4"
                type="video/mp4"
            >

            Your browser does not support HTML5 video.

        </video>

        <div class="video-overlay"></div>

    </div>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <header>

        <a href="#" class="brand">

            <span class="brand-mark"></span>

            <span class="brand-name">
                JIAN TOOLS
            </span>

        </a>

        <div class="nav-status">

            <span class="status-dot"></span>

            WEBSITE LAUNCHING SOON

        </div>

    </header>


    <!-- =========================================
         MAIN HERO
    ========================================== -->

    <main>

        <section class="content">

            <div class="eyebrow">

                <span class="eyebrow-line"></span>

                PRECISION ENGINEERED

            </div>


            <h1>
                JIAN<br>
                TOOLS
            </h1>


            <div class="coming-soon">
                Coming Soon
            </div>


            <p class="tagline">
                Your solution provider for all your carbide
                cutting tools need.
            </p>


            <a
                href="https://wa.me/917984876123"
                target="_blank"
                rel="noopener noreferrer"
                class="contact-btn"
            >

                Contact JIAN TOOLS

                <span class="arrow">
                    →
                </span>

            </a>

        </section>

    </main>


    <!-- =========================================
         BOTTOM INFORMATION
    ========================================== -->

    <div class="bottom-info">

        <div class="location">

            967 / 7, Ground Floor, Makarpura GIDC,
            Vadodara – 390 010, Gujarat

        </div>


        <div class="scroll-indicator">

            <span>
                Explore
            </span>

            <span class="scroll-line"></span>

        </div>

    </div>


    <!-- =========================================
         PLAY FALLBACK
    ========================================== -->

    <div
        class="play-overlay"
        id="playOverlay"
    >

        <div class="play-button">
            ▶
        </div>

    </div>


    <script>

        const video = document.getElementById("heroVideo");
        const loader = document.getElementById("loader");
        const playOverlay = document.getElementById("playOverlay");


        /*
        ==========================================
        HIDE LOADER
        ==========================================
        */

        function hideLoader() {

            setTimeout(() => {

                loader.classList.add("hidden");

            }, 1200);

        }


        /*
        ==========================================
        VIDEO READY
        ==========================================
        */

        video.addEventListener("canplay", () => {

            hideLoader();

        });


        /*
        ==========================================
        AUTOPLAY FALLBACK
        ==========================================
        */

        video.play()
            .then(() => {

                hideLoader();

            })
            .catch(() => {

                hideLoader();

                playOverlay.classList.add("visible");

            });


        /*
        ==========================================
        PLAY BUTTON
        ==========================================
        */

        playOverlay.addEventListener("click", () => {

            video.muted = false;

            video.play();

            playOverlay.classList.remove("visible");

        });


        /*
        ==========================================
        LOOP VIDEO
        ==========================================
        */

        video.addEventListener("ended", () => {

            video.currentTime = 0;

            video.play();

        });


        /*
        ==========================================
        KEYBOARD ACCESSIBILITY
        ==========================================
        */

        document.addEventListener("keydown", (event) => {

            if (event.code === "Space") {

                event.preventDefault();

                if (video.paused) {

                    video.play();

                } else {

                    video.pause();

                }

            }

        });

    </script>

</body>
</html>
